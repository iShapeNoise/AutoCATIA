{% extends 'base.html' %}
{% block content %}
    {{ render_menu('drawing')|safe }}
    <div class="mb-4 mt-4 border border-secondary rounded p-3 mb-3 bg-dark bg-opacity-50">
        <h4 class="text-white border-bottom border-white pb-1 mb-3">{{ lang_manager.t('pages.drawing.update_bom', 'Update B.O.M.') }}</h4>
        <!-- Drawing Selection with Button -->
        <div class="mb-3">
            <div class="row g-2">
                <div class="col-md-8">
                    <select class="form-select"
                            id="drawingSelect"
                            name="drawing">
                        <option value="">Loading drawings...</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-dark btn-sm w-100 border-white p-1 m-1 rounded-1"
                            id="checkBomBtn"
                            hx-get="/htmx/drawing/bom/check"
                            hx-target="#bomContent"
                            hx-include="#drawingSelect">
                        {{ lang_manager.t('pages.drawing.check_bom', 'Check B.O.M.') }}
                    </button>
                </div>
            </div>
        </div>
    </div>
    <!-- Load drawings on page load -->
    <div hx-get="/htmx/drawing/bom/drawings"
         hx-target="#drawingSelect"
         hx-trigger="load"
         hx-swap="innerHTML"></div>

    <!-- B.O.M. Content Area -->
    <div id="bomContent">
        <!-- Content will be loaded here via HTMX -->
    </div>

{% endblock %}
