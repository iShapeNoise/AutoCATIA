{% extends 'base.html' %}

{% block content %}
    {{ render_menu('part')|safe }}
    <div class="container mt-3">
        <form id="partForm" hx-post="/htmx/part/create_new" hx-target="#create_new" hx-swap="innerHtml" hx-indicator="#create_new">
            <!-- Project Settings Section -->
            <h3 class="mt-4">Project Settings</h3>
            <div class="col-12">
                <label for="formProjectPath" class="form-label">Project Path</label>
                <input name="project_path" type="text" class="form-control rounded-0" id="path_input_container">
                <small class="text-muted">Directory where the CATPart file will be saved</small>
            </div>
            <div class="mt-2 border border-secondary rounded p-3 mb-3 bg-dark bg-opacity-50" id="create_new">
                {% include('partials/spinner.html') %}
                {% include('partials/form_product_properties.html') %}
            </div>
        </form>

        <div id="create_new">
            {% include('partials/spinner.html') %}
        </div>
    </div>

    <script>
        function updatePartNumber() {
            const number = document.querySelector('[name="number"]')?.value || '001';
            const title = document.querySelector('[name="title"]')?.value || 'Part';
            const revision = document.querySelector('[name="revision"]')?.value || 'P01';
            const partNumber = `${number}_${title}_${revision}`;

            const partNumberField = document.querySelector('[name="part_number"]');
            if (partNumberField) {
                partNumberField.value = partNumber;
            }
        }

        // Set default values and pattern on page load
        document.addEventListener('DOMContentLoaded', function() {

            // Set default title
            const numberField = document.querySelector('[name="number"]');
            if (numberField && !numberField.value) {
                numberField.value = '001';
            }
            // Set default title
            const titleField = document.querySelector('[name="title"]');
            if (titleField && !titleField.value) {
                titleField.value = 'Part';
            }

            // Set default revision
            const revisionField = document.querySelector('[name="revision"]');
            if (revisionField && !revisionField.value) {
                revisionField.value = 'P01';
            }

            // Set initial part number pattern
            updatePartNumber();

            // Add event listeners to update part number when fields change
            if (numberField) {
                numberField.addEventListener('input', updatePartNumber);
            }
            if (titleField) {
                titleField.addEventListener('input', updatePartNumber);
            }
            if (revisionField) {
                revisionField.addEventListener('input', updatePartNumber);
            }
        });
        document.addEventListener('htmx:afterRequest', function(event) {
            const response = event.detail.xhr.response;

            if (response) {
                try {
                    const data = JSON.parse(response);

                    if (data.success) {
                        // Show success popup
                        showNotification(data.message, 'success');

                        // Update form with new data
                        if (data.form_html) {
                            document.getElementById('create_new').innerHTML = data.form_html;
                        }
                    } else {
                        // Show error popup
                        showNotification(data.message, 'error');
                    }
                } catch (e) {
                    // Handle non-JSON responses (fallback)
                    console.error('Response is not JSON:', response);
                }
            }
        });

        function showNotification(message, type) {
            // Create notification element
            const notification = document.createElement('div');
            notification.className = `alert alert-${type === 'success' ? 'success' : 'danger'} alert-dismissible fade show position-fixed`;
            notification.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 300px;';
            notification.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;

            // Add to page
            document.body.appendChild(notification);

            // Auto-remove after 5 seconds
            setTimeout(() => {
                if (notification.parentNode) {
                    notification.remove();
                }
            }, 5000);
        }
    </script>
{% endblock %}
