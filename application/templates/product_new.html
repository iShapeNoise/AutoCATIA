{% extends 'base.html' %}

{% block content %}
    {{ render_menu('product')|safe }}
    <div class="container mt-3">
        <form id="productForm" hx-post="/htmx/product/create_new" hx-target="#create_new" hx-swap="innerHtml" hx-indicator="#create_new">
            <div class="mt-2 border border-secondary rounded p-3 mb-3 bg-dark bg-opacity-50" id="create_new">
                {% include('partials/spinner.html') %}
                {% include('partials/form_product_properties.html') %}
            </div>

            <!-- Project Settings Section -->
            <h3 class="mt-4">Project Settings</h3>
            <div class="col-12">
                <label for="formProjectPath" class="form-label">Project Path</label>
                <input name="project_path" type="text" class="form-control rounded-0" id="path_input_container">
                <small class="text-muted">Directory where the CATPart file will be saved</small>
            </div>

            <!-- Create Button -->
            <div class="mt-3 text-center">
                <button type="submit" class="btn btn-dark btn-sm w-80 border-white p-1 m-1 rounded-1" onclick="updateProductNumber()">
                    Create Product
                </button>
            </div>
        </form>

        <div id="create_new">
            {% include('partials/spinner.html') %}
        </div>
    </div>

    <!-- JavaScript for auto-updating product number -->
    <script>
        function updateProductNumber() {
            const number = document.getElementById('formnumber').value || '001';
            const title = document.getElementById('formtitle').value || 'Product';
            const revision = document.getElementById('formrevision').value || 'A';
            const productNumber = `${number}_${title}_P${revision}`;

            const partNumberField = document.getElementById('formpart_number');
            if (partNumberField) {
                partNumberField.value = productNumber;
            }
        }

        // Add event listeners for real-time updates
        document.addEventListener('DOMContentLoaded', function() {
            const numberField = document.getElementById('formnumber');
            const titleField = document.getElementById('formtitle');
            const revisionField = document.getElementById('formrevision');

            if (numberField) numberField.addEventListener('input', updateProductNumber);
            if (titleField) titleField.addEventListener('input', updateProductNumber);
            if (revisionField) revisionField.addEventListener('input', updateProductNumber);

            // Load path input
            fetch('/htmx/document/path')
                .then(response => response.text())
                .then(html => {
                    document.getElementById('path_input_container').innerHTML = html;
                });
        });
    </script>
{% endblock %}
