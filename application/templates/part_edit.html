{% extends 'base.html' %}

{% block content %}
    {{ render_menu('part')|safe }}
    <div class="container">
        <div class=" mt-3 border border-secondary rounded p-3 mb-3 bg-dark bg-opacity-50">
            <!-- Part Properties Section -->
            <div class="row mt-3">
                <div class="col-12 ">
                    <h4 class="mb-4 text-white border-bottom border-white pb-1 mb-3">Part Properties</h4>
                    <form
                        id="partPropertiesForm"
                        hx-post="/htmx/part/properties"
                        hx-target="#part_properties_result"
                        hx-swap="innerHtml"
                        hx-indicator="#part_properties_result"
                    >
                        <div class="row mt-3" id="part_properties_result">
                            {% include('partials/form_attributes_edit.html') %}
                        </div>
                    </form>
                    <div class="row mt-3">
                        <div class="col-12">
                            <button type="submit" form="partPropertiesForm" class="btn btn-primary">
                                Update Part
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Points Section -->
            <h4 class="mt-3 text-white border-bottom border-white pb-1 mb-3">Points</h4>
            <div class="row">
                <div class="col-12">
                    <div>
                        <div>
                            {% include 'part_points.html' %}
                        </div>
                    </div>
                </div>
            </div>
            <!-- Bounding Box Section -->
            <h4 class="text-white border-bottom border-white pb-1 mb-3">Bounding Box</h4>
            <div class="row">
                <div class="col-12">
                    <div>
                        <div>
                            {% include 'part_bounding_box.html' %}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Validate part selection before operations
    function validatePartSelection() {
        const partSelect = document.getElementById('part_select');
        if (!partSelect.value) {
            alert('Please select a part first.');
            return false;
        }
        return true;
    }

    // Add validation to forms if needed
    const forms = document.querySelectorAll('form');
    forms.forEach(form => {
        if (form.getAttribute('hx-post')) {
            form.addEventListener('submit', function(e) {
                if (!validatePartSelection()) {
                    e.preventDefault();
                }
            });
        }
    });
});
</script>
