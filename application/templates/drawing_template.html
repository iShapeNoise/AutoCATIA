{% extends 'base.html' %}

{% block content %}
    <!-- {{ self._TemplateReference__context.name }} -->
    {{ render_menu('drawing')|safe }}

    <h2 class="mt-3">Edit Drawing Template</h2>

    <!-- Add JavaScript for auto-date -->
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const createdOnField = document.getElementById('formCreatedOn');
        if (createdOnField && !createdOnField.value) {
            const today = new Date();
            const day = String(today.getDate()).padStart(2, '0');
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const year = today.getFullYear();
            createdOnField.value = `${day}.${month}.${year}`;
        }
    });
    </script>

    <form hx-post="/htmx/drawing/template/save" hx-target="#template" hx-swap="innerHtml">
        <!-- Existing fields -->
        <div class="row mb-3">
            <div class="col">
                <label for="formDrawingNumber" class="form-label">Drawing Number</label>
                <input name="DRAWING-NUMBER" type="text" class="form-control rounded-0" id="formDrawingNumber"
                       value="{{ parameters['DRAWING-NUMBER'] }}">
            </div>
            <div class="col">
                <label for="formTitle" class="form-label">Title</label>
                <input name="TITLE" type="text" class="form-control rounded-0" id="formTitle" value="{{ parameters['TITLE'] }}">
            </div>
        </div>

        <!-- New fields row 1 -->
        <div class="row mb-3">
            <div class="col">
                <label for="formCreatedOn" class="form-label">Created On</label>
                <input name="CREATED-ON" type="text" class="form-control rounded-0" id="formCreatedOn"
                       value="{{ parameters.get('CREATED-ON', '') }}" placeholder="dd.mm.yyyy">
            </div>
            <div class="col">
                <label for="formDrawnBy" class="form-label">Created By</label>
                <input name="CREATED-BY" type="text" class="form-control rounded-0" id="formDrawnBy"
                       value="{{ parameters['CREATED-BY'] }}">
            </div>
        </div>

        <!-- New fields row 2 -->
        <div class="row mb-3">
            <div class="col">
                <label for="formManager" class="form-label">Manager</label>
                <input name="MANAGER" type="text" class="form-control rounded-0" id="formManager"
                       value="{{ parameters.get('MANAGER', '') }}">
            </div>
            <div class="col">
                <label for="formPartNumber" class="form-label">Part Number</label>
                <input name="PART-NUMBER" type="text" class="form-control rounded-0" id="formPartNumber"
                       value="{{ parameters.get('PART-NUMBER', '') }}">
            </div>
        </div>

        <!-- New fields row 3 -->
        <div class="row mb-3">
            <div class="col">
                <label for="formMaterial" class="form-label">Material</label>
                <input name="MATERIAL" type="text" class="form-control rounded-0" id="formMaterial"
                       value="{{ parameters.get('MATERIAL', '') }}">
            </div>
            <div class="col">
                <label for="formDocumentType" class="form-label">Document Type</label>
                <input name="DOCUMENT-TYPE" type="text" class="form-control rounded-0" id="formDocumentType"
                       value="{{ parameters.get('DOCUMENT-TYPE', '') }}">
            </div>
        </div>

        <!-- Comments field -->
        <div class="row mb-3">
            <div class="col">
                <label for="formComments" class="form-label">Comments</label>
                <textarea name="COMMENTS" class="form-control rounded-0" id="formComments" rows="3">{{ parameters.get('COMMENTS', '') }}</textarea>
            </div>
            <div class="col">
                <label for="formRevision" class="form-label">Revision</label>
                <input name="REVISION" type="text" class="form-control rounded-0" id="formRevision"
                       value="{{ parameters['REVISION'] }}">
            </div>
        </div>
        <div class="text-center">
            <button name="template" class="btn rounded-1 btn-outline-primary m-2" value="template" type="submit">
                Save Template
            </button>
        </div>
    </form>


    <div id="template">
        {% include('partials/spinner.html') %}
    </div>

{% endblock %}
