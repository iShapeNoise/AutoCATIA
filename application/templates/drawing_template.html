{% extends 'base.html' %}

{% block content %}
    <!-- {{ self._TemplateReference__context.name }} -->
    {{ render_menu('drawing')|safe }}

    <h2 class="mt-3">{{ lang_manager.t('pages.drawing.edit_template', 'Edit Drawing Template') }}</h2>

    <!-- Add JavaScript for auto-date and format detection -->
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // Auto-fill date with current month/year
        const dateField = document.getElementById('formDate');
        if (dateField && !dateField.value) {
            const today = new Date();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const year = today.getFullYear();
            dateField.value = `${month}/${year}`;
        }

        // Auto-fill format based on current drawing
        const formatField = document.getElementById('formFormat');
        if (formatField && !formatField.value) {
            // This will be populated by server-side logic
            // For now, we'll leave it empty and let the template handler fill it
        }
    });
    </script>

    <form hx-post="{{ url_for('htmx_drawing_template') }}" hx-target="#template-result" hx-swap="innerHTML">
        <div class="container-fluid">
            <div class="row">
                <!-- First Column -->
                <div class="col-6">
                    <div class="mb-3">
                        <label for="formScale" class="form-label">{{ lang_manager.t('labels.scale', 'Scale') }}</label>
                        <input name="SCALE" type="text" class="form-control rounded-0" id="formScale" value="1:1">
                    </div>

                    <div class="mb-3">
                        <label for="formDocumentType" class="form-label">{{ lang_manager.t('labels.document_type', 'Document Type') }}</label>
                        <input name="DOCUMENT-TYPE" type="text" class="form-control rounded-0" id="formDocumentType">
                    </div>

                    <div class="mb-3">
                        <label for="formCreatedBy" class="form-label">{{ lang_manager.t('labels.created_by', 'Created By') }}</label>
                        <input name="CREATED-BY" type="text" class="form-control rounded-0" id="formCreatedBy">
                    </div>

                    <div class="mb-3">
                        <label for="formApprovedBy" class="form-label">{{ lang_manager.t('labels.approved_by', 'Approved By') }}</label>
                        <input name="APPROVED-BY" type="text" class="form-control rounded-0" id="formApprovedBy">
                    </div>

                    <div class="mb-3">
                        <label for="formTitle" class="form-label">{{ lang_manager.t('labels.title', 'Title') }}</label>
                        <input name="TITLE" type="text" class="form-control rounded-0" id="formTitle">
                    </div>

                    <div class="mb-3">
                        <label for="formExtraTitle" class="form-label">{{ lang_manager.t('labels.extra_title', 'Extra Title') }}</label>
                        <input name="EXTRA-TITLE" type="text" class="form-control rounded-0" id="formExtraTitle">
                    </div>
                </div>

                <!-- Second Column -->
                <div class="col-6">
                    <div class="mb-3">
                        <label for="formNumber" class="form-label">{{ lang_manager.t('labels.number', 'Number') }}</label>
                        <input name="NUMBER" type="text" class="form-control rounded-0" id="formNumber">
                    </div>

                    <div class="mb-3">
                        <label for="formMaterial" class="form-label">{{ lang_manager.t('labels.material', 'Material') }}</label>
                        <input name="MATERIAL" type="text" class="form-control rounded-0" id="formMaterial">
                    </div>

                    <div class="mb-3">
                        <label for="formBlank" class="form-label">{{ lang_manager.t('labels.blank', 'Blank') }}</label>
                        <input name="BLANK" type="text" class="form-control rounded-0" id="formBlank">
                    </div>

                    <div class="mb-3">
                        <label for="formRevision" class="form-label">{{ lang_manager.t('labels.revision', 'Rev.') }}</label>
                        <input name="REVISION" type="text" class="form-control rounded-0" id="formRevision">
                    </div>

                    <div class="mb-3">
                        <label for="formDate" class="form-label">{{ lang_manager.t('labels.date', 'Date') }}</label>
                        <input name="DATE" type="text" class="form-control rounded-0" id="formDate"
                               placeholder="{{ lang_manager.t('labels.date_placeholder', 'MM/YYYY') }}">
                    </div>

                    <div class="mb-3">
                        <label for="formFormat" class="form-label">{{ lang_manager.t('labels.format', 'Format') }}</label>
                        <input name="FORMAT" type="text" class="form-control rounded-0" id="formFormat" readonly>
                    </div>

                    <div class="mb-3">
                        <label for="formPage" class="form-label">{{ lang_manager.t('labels.page', 'Page') }}</label>
                        <input name="PAGE" type="text" class="form-control rounded-0" id="formPage" value="1/1" readonly>
                    </div>
                </div>
            </div>

            <div class="text-center mt-3">
                <button type="submit" class="btn btn-primary rounded-1">
                    {{ lang_manager.t('labels.save_template', 'Save Template Settings') }}
                </button>
            </div>
        </div>
    </form>

    <div id="template-result" class="mt-3">
        {% include('partials/spinner.html') %}
    </div>

{% endblock %}
